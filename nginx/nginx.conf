user  nginx;
worker_processes  auto;
# Raise the per-worker fd limit above worker_connections (container default soft limit is 1024)
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    # Never write the startup token (?token=...) to the access log.
    map $request_uri $loggable_uri {
        "~^(?<path>[^?]*)\?(.*&)?token="  "$path?token=***";
        default                          $request_uri;
    }
    log_format  safe  '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  safe;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # WebSocket upgrade support (dsh uses /api/remote.mux over WebSocket)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rendered from ./nginx/templates/<NGINX_MODE>/*.template at container start
    include /etc/nginx/conf.d/dsh.conf;
    # Your own extra server blocks (./nginx/custom.d/*.conf)
    include /etc/nginx/custom.d/*.conf;
}
