# Shared reverse-proxy settings for the dsh Web UI.
# dsh listens on 127.0.0.1 inside the shared network namespace.

proxy_http_version 1.1;

# dsh checks the browser-visible Host against --trusted-host: forward it unchanged
# ($http_host keeps a non-default port such as :8080).
proxy_set_header Host              $http_host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Long-lived WebSocket / streaming responses
proxy_read_timeout  1d;
proxy_send_timeout  1d;
proxy_buffering     off;
proxy_request_buffering off;

# Optional extra layer of auth in front of dsh (see nginx/snippets/auth/README)
include /etc/nginx/snippets/auth/*.conf;
